# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: pl-PL

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "docs/specs/**"
      instructions: |
        Specyfikacja (spec-driven development, zasady w docs/specs/README.md). Sprawdź szczególnie:
        - czy każde wymaganie ma identyfikator <PREFIKS>-<NN> i kryteria akceptacji w formie "Zakładając / gdy / wtedy",
        - czy wymagania są testowalne: bez sformułowań typu "szybko", "zwykle", "odpowiednio", z konkretnymi liczbami i warunkami,
        - sprzeczności z AGENTS.md (zwłaszcza sekcją Bezpieczeństwo) i z docs/plan.md,
        - brakujące przypadki błędów i brzegowe (timeout, zła ilość, inny nadawca, nierozpoznana odpowiedź),
        - czy status "zatwierdzona" nie ma otwartych pytań,
        - prawdziwe sekrety, PIN-y lub numery telefonu w danych testowych.
    - path: "app/src/test/**"
      instructions: |
        Testy jednostkowe. Sprawdź, czy nazwy testów zawierają identyfikatory wymagań ze specyfikacji
        (np. TOTP-02) i czy każde wymaganie wymienione w opisie PR ma test. Testy TOTP używają tylko wektorów z RFC 6238.
    - path: "**/sms/**"
      instructions: |
        Kod wysyłania i odbioru SMS. Sprawdź szczególnie:
        - filtrowanie wiadomości po numerze AAPS i ignorowanie SMS-ów sprzed wysłania polecenia,
        - obsługę SMS-ów wieloczęściowych i błędów SmsManager,
        - brak treści SMS i numerów telefonu w logach.
    - path: "**/otp/**"
      instructions: |
        Generowanie TOTP. Sprawdź szczególnie:
        - zgodność z RFC 6238 (HMAC-SHA1, 30 s, 6 cyfr) i testy na wektorach z RFC,
        - obsługę kodu bliskiego wygaśnięcia,
        - że sekret i kody nigdy nie są logowane ani wyświetlane.
    - path: "**/security/**"
      instructions: |
        Keystore i szyfrowanie sekretu TOTP. Aplikacja nie używa biometrii. Sprawdź szczególnie:
        - setUnlockedDeviceRequired(true) dla klucza szyfrującego sekret TOTP,
        - że PIN AAPS nigdy nie jest zapisywany, tylko trzymany w pamięci i czyszczony po poleceniu,
        - brak sekretów, PIN-ów i kluczy w logach, wyjątkach i kodzie.
